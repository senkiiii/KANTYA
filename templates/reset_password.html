{% extends 'base.html' %}{% block content %}
<section class="login-card signin-card">
<a class="auth-back" href="{{url_for('forgot_password')}}">← Request another code</a>
<header class="signin-identity">
  <img class="signin-seal" src="{{ url_for('static', filename='isu-logo.webp') }}" alt="Isabela State University" width="64" height="74">
  <div><strong>KANTYA</strong></div>
</header>
<h1>Reset Password</h1>
<p class="muted">Enter your latest six-digit reset code. It expires after 5 minutes.</p>
{% include 'notices.html' %}
<form method="post"><input type="hidden" name="csrf" value="{{session.csrf}}">
<label for="otp">Verification Code</label>
<input id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" placeholder="6-digit code">
<label for="password">New Password</label><input id="password" name="password" type="password" minlength="6" maxlength="30" required autocomplete="new-password">
<label for="confirm_password">Confirm New Password</label><input id="confirm_password" name="confirm_password" type="password" minlength="6" maxlength="30" required autocomplete="new-password">
<p class="muted">Use 6–30 characters. A passphrase is welcome.</p>
<button class="signin" type="submit">Reset Password</button></form>
</section>{% endblock %}
