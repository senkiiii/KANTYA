{% extends 'base.html' %}{% block content %}<section class="login-card"><h1>Update your password</h1><p class="muted">Before using KANTYA, choose a new password with 6–30 characters.</p><form method="post"><input type="hidden" name="csrf" value="{{session.csrf}}"><label>Current password</label><input type="password" name="current_password" required autocomplete="current-password"><label>New password</label><input type="password" name="new_password" required minlength="6" maxlength="30" autocomplete="new-password"><label>Confirm new password</label><input type="password" name="confirm_password" required minlength="6" maxlength="30" autocomplete="new-password"><button class="signin">Update password</button></form></section>{% endblock %}
