{% extends 'base.html' %}{% block content %}
<section class="login-card signin-card">
<a class="auth-back" href="{{url_for('choose_role')}}">← Back to roles</a>
<header class="signin-identity">
  <img class="signin-seal" src="{{ url_for('static', filename='isu-logo.webp') }}" alt="Isabela State University" width="64" height="74">
  <div><strong>KANTYA</strong></div>
</header>
<h1>Forgot Password?</h1>
<p class="muted">Enter the email address where you want to receive a verification code.</p>
{% include 'notices.html' %}
<form method="post">
<input type="hidden" name="csrf" value="{{session.csrf}}">

<label for="email">Email Address</label>
<input id="email" name="email" type="email" required maxlength="254" autocomplete="email" placeholder="name@example.com">
<button class="signin" type="submit">Send reset code</button>
</form>
<p class="login-note">Already remember your password? <a href="{{url_for('choose_role')}}">Back to Log In</a></p>
</section>{% endblock %}
